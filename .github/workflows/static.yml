name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  # 每天北京时间 06:00（UTC 22:00）自动抓取；UTC 21:55(北京05:55)提前触发以错开整点高峰，让实际运行更贴近 6 点
  schedule:
    - cron: '55 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 定时 / 手动触发时，抓取最新基金与指数行情数据并提交回仓库
      - name: Fetch latest data (funds + index quotes)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          node scripts/run-fetch-local.js; fund=$?
          node scripts/run-fetch-index.js; index=$?
          echo "基金抓取退出码=$fund，指数抓取退出码=$index"
          if [ $fund -ne 0 ] || [ $index -ne 0 ]; then
            echo "::warning::部分数据抓取失败（fund=$fund, index=$index），对应数据本次未更新"
          fi

      - name: Commit updated data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/nasdaq-funds.js js/index-quotes.js
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
          else
            git commit -m "chore: daily data refresh ($(date -u '+%F %T UTC'))"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4