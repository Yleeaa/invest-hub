<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="文章 - 生活大于投资">
    <title> 叨居</title>
    <link rel="stylesheet" href="css/style.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=Inter:wght@200;300;400;500;600;700;800;900&family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a961;
            --gold-bright: #d4b56a;
            --gold-soft: rgba(201, 169, 97, 0.15);
            --white: #f0f0f0;
            --white-soft: rgba(255, 255, 255, 0.15);
            --white-glow: rgba(255, 255, 255, 0.4);
            --accent-gradient: linear-gradient(135deg, #c9a961 0%, #f0f0f0 100%);
            --title-gradient: linear-gradient(135deg, #f7e7a0 0%, #d4b56a 45%, #ffffff 100%);
            --bg: #000000;
            --bg-soft: #0a0a0a;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.06);
            --surface-border: rgba(255, 255, 255, 0.08);
            --text: #f0f0f0;
            --text-soft: #a8a8a8;
            --text-dim: #555555;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }
        /* 隐藏滚动条 */
        html { scrollbar-width: none; -ms-overflow-style: none; }
        html::-webkit-scrollbar { display: none; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            position: relative;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        body::-webkit-scrollbar { display: none; }
        /* 顶部渐变遮罩：避免滚动内容与固定品牌/导航重叠 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 7rem;
            background: linear-gradient(to bottom, var(--bg) 0%, rgba(0, 0, 0, 0.88) 55%, transparent 100%);
            z-index: 999;
            pointer-events: none;
        }

        .serif { font-family: 'Cormorant Garamond', 'Noto Sans SC', sans-serif; }
        .display { font-family: 'Cormorant Garamond', 'Noto Sans SC', sans-serif; }

        /* ===== 左上角品牌区 ===== */
        .brand {
            position: fixed;
            top: 1.5rem;
            left: 1.75rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .brand-title {
            font-family: 'Noto Serif SC', 'Cormorant Garamond', 'Songti SC', 'STSong', 'PingFang SC', serif;
            font-weight: 900;
            font-size: 1.9rem;
            background: linear-gradient(135deg, #f7e7a0 0%, #d4b56a 45%, #8a6e30 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            letter-spacing: 6px;
            line-height: 1.15;
            position: relative;
            display: inline-block;
            padding: 0.15rem 0 0.5rem;
            align-self: flex-start;
            text-shadow: 0 0 40px rgba(201, 169, 97, 0.4);
            font-feature-settings: "palt" 1;
        }
        .brand-title::before {
            content: '';
            position: absolute;
            left: -0.85rem;
            top: 50%;
            transform: translateY(-50%);
            width: 2px;
            height: 65%;
            background: linear-gradient(180deg, transparent, var(--gold) 25%, var(--gold) 75%, transparent);
            border-radius: 2px;
            opacity: 0.7;
        }
        .brand-subtitle {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            font-size: 0.6rem;
            font-weight: 400;
            color: var(--text-dim);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* ===== 右上角导航 ===== */
        .top-nav {
            position: fixed;
            top: 1.5rem;
            right: 1.75rem;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0;
        }
        .top-nav-menu {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 0;
            margin: 0;
            padding: 0;
        }
        .top-nav-menu li {
            list-style: none;
            position: relative;
        }
        .top-nav-menu li + li::before {
            content: '';
            display: inline-block;
            width: 1px;
            height: 12px;
            background: rgba(201, 169, 97, 0.25);
            margin: 0 0.5rem;
            vertical-align: middle;
        }
        .top-nav-menu a {
            display: inline-block;
            color: var(--text-soft);
            text-decoration: none;
            padding: 0.4rem 0.85rem;
            font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', sans-serif;
            font-size: 0.78rem;
            font-weight: 400;
            letter-spacing: 2px;
            position: relative;
            transition: color 0.3s ease;
        }
        .top-nav-menu a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 1px;
            background: var(--gold);
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .top-nav-menu a:hover {
            color: var(--text);
        }
        .top-nav-menu a:hover::after,
        .top-nav-menu a.active::after {
            width: calc(100% - 1.7rem);
        }
        .top-nav-menu a.active {
            color: var(--gold);
        }
        .top-nav-toggle {
            display: none;
            width: 36px;
            height: 36px;
            padding: 0;
            background: none;
            border: 1px solid rgba(201, 169, 97, 0.3);
            border-radius: 100px;
            color: var(--gold);
            cursor: pointer;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 4px;
            transition: border-color 0.3s ease, background 0.3s ease;
        }
        .top-nav-toggle:hover {
            border-color: var(--gold);
            background: rgba(201, 169, 97, 0.08);
        }
        .top-nav-toggle span {
            display: block;
            width: 16px;
            height: 1.5px;
            background: var(--gold);
            border-radius: 2px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .top-nav.open .top-nav-toggle span:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }
        .top-nav.open .top-nav-toggle span:nth-child(2) { opacity: 0; }
        .top-nav.open .top-nav-toggle span:nth-child(3) { transform: translateY(-5.5px) rotate(-45deg); }

        /* ===== 主内容区 ===== */
        .main-content {
            position: relative;
            width: 100%;
            min-height: 100vh;
            padding-top: 6rem;
            padding-bottom: 2rem;
        }

        /* 网格背景 */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 80px 80px;
            mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* 页面头部 */
        .page-header {
            position: relative;
            z-index: 10;
            padding: 2rem 2rem 1.5rem;
            border-bottom: 1px solid var(--surface-border);
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            max-width: 1280px;
            margin: 0 auto;
            flex-wrap: wrap;
        }
        .header-left {
            text-align: left;
            flex: 1;
            min-width: 280px;
        }
        .page-title {
            font-family: 'Noto Serif SC', 'Cormorant Garamond', 'Songti SC', serif;
            font-size: clamp(2rem, 4vw, 2.8rem);
            font-weight: 900;
            line-height: 1.2;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f7e7a0 0%, #d4b56a 45%, #8a6e30 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            margin-bottom: 0.6rem;
            text-shadow: 0 0 32px rgba(201, 169, 97, 0.25);
        }
        .page-update-time {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: var(--gold);
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-bottom: 0.85rem;
        }
        .page-update-time::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 8px var(--gold);
        }
        .page-subtitle {
            font-size: 0.88rem;
            color: var(--text-soft);
            line-height: 1.7;
            letter-spacing: 0.5px;
            max-width: 560px;
        }
        .footer-qr {
            position: absolute;
            right: 2rem;
            bottom: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
        }
        .footer-qr-img {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(201, 169, 97, 0.1));
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .footer-qr-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }
        .footer-qr:hover .footer-qr-img {
            border-color: rgba(255, 255, 255, 0.65);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
        }
        .footer-qr span {
            font-size: 0.65rem;
            color: var(--text-soft);
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }
        .footer-qr:hover span {
            color: var(--white);
        }
        /* 二维码放大弹窗 */
        .qr-popup {
            position: absolute;
            bottom: calc(100% + 0.75rem);
            right: 0;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            box-shadow: 0 12px 40px rgba(255, 255, 255, 0.12);
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px);
            transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
            z-index: 100;
        }
        .footer-qr:hover .qr-popup {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .qr-popup-img {
            width: 180px;
            height: 180px;
            background: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            position: relative;
            overflow: hidden;
        }
        .qr-popup-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }
        .qr-popup-title {
            font-size: 0.8rem;
            background: linear-gradient(135deg, #f0f0f0 0%, #ffffff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .qr-popup-desc {
            font-size: 0.7rem;
            color: var(--text-soft);
        }

        /* 文章列表 */
        .article-section {
            position: relative;
            z-index: 1;
            max-width: 1280px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .article-section > h3 {
            background: linear-gradient(135deg, #d4b56a 0%, #ffffff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            font-size: 1.25rem;
            margin-bottom: 1.25rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            display: inline-block;
        }
        .category-group {
            margin-bottom: 2.5rem;
        }
        .category-group:last-child { margin-bottom: 0; }
        .category-header {
            margin-bottom: 1.25rem;
        }
        .category-header h3 {
            background: linear-gradient(135deg, #d4b56a 0%, #ffffff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
        }
        .category-header h3 .cat-count {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-dim);
            font-style: italic;
            -webkit-text-fill-color: var(--text-dim);
        }
        .category-desc {
            color: var(--text-soft);
            font-size: 0.82rem;
            line-height: 1.6;
            letter-spacing: 0.3px;
        }

        /* 文章区两栏布局 */
        .article-layout {
            display: flex;
            gap: 2rem;
            align-items: flex-start;
        }

        /* 左侧分类树：top 与顶部遮罩高度对齐，避免被遮罩覆盖 */
        .category-tree {
            width: 250px;
            min-width: 250px;
            position: sticky;
            top: 7rem;
            z-index: 10;
        }
        .tree-title {
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 0 0.75rem 0.75rem;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid var(--surface-border);
        }
        .tree-node { margin-bottom: 0.15rem; }
        .tree-node-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 0.75rem;
            cursor: pointer;
            color: var(--text-soft);
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 6px;
            transition: color 0.25s ease, background 0.25s ease;
            user-select: none;
        }
        .tree-node-header:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }
        .tree-node-header.active { color: var(--white); background: var(--white-soft); border-left: 2px solid var(--white); padding-left: calc(0.75rem - 2px); }
        .tree-toggle {
            width: 12px;
            height: 12px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
            opacity: 0.55;
            transition: transform 0.25s ease;
        }
        .tree-node.collapsed .tree-toggle { transform: rotate(-90deg); }
        .tree-icon {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }
        .tree-label {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tree-count {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.8rem;
            color: var(--text-dim);
            font-style: italic;
        }
        .tree-node-header.active .tree-count { color: var(--white); }
        .tree-children {
            list-style: none;
            overflow: hidden;
            max-height: 3000px;
            transition: max-height 0.35s ease;
            padding-left: 1.5rem;
            margin: 0.15rem 0 0.25rem;
        }
        .tree-node.collapsed .tree-children { max-height: 0; }
        .tree-leaf {
            padding: 0.45rem 0.5rem 0.45rem 1rem;
            color: var(--text-dim);
            font-size: 0.78rem;
            line-height: 1.4;
            cursor: pointer;
            border-left: 1px solid var(--surface-border);
            transition: color 0.25s ease, border-color 0.25s ease;
            position: relative;
        }
        .tree-leaf::before {
            content: '';
            position: absolute;
            left: -1px;
            top: 50%;
            width: 10px;
            height: 1px;
            background: var(--surface-border);
            transition: background 0.25s ease;
        }
        .tree-leaf:hover { color: var(--text); border-left-color: var(--gold); }
        .tree-leaf:hover::before { background: var(--gold); }

        /* 右侧文章内容 */
        .article-content { flex: 1; min-width: 0; }

        /* 标签内容面板 */
        .tab-panel { display: none; animation: fadeIn 0.4s ease; }
        .tab-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .article-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .article-item {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.05) 100%);
            border: 1px solid var(--surface-border);
            border-left: 3px solid var(--gold);
            border-radius: 10px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .article-item:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.1) 100%);
            border-color: rgba(255, 255, 255, 0.25);
            border-left-color: var(--white);
            transform: translateX(4px);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
        }
        .article-item .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
            color: var(--text-dim);
            font-size: 0.8rem;
        }
        .article-item .title {
            background: linear-gradient(135deg, #f0f0f0 0%, #d4b56a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .article-item .summary {
            color: var(--text-soft);
            font-size: 0.9rem;
            line-height: 1.7;
        }

        /* 徽标 */
        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 100px;
            font-size: 0.72rem;
        }
        .badge-accent {
            background: linear-gradient(135deg, rgba(201, 169, 97, 0.15) 0%, rgba(255, 255, 255, 0.12) 100%);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        /* 页脚 */
        .footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 3rem 2rem 2.5rem;
            margin-top: 2rem;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.03));
        }
        .footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 480px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        }
        .footer-mark {
            font-family: 'Cormorant Garamond', 'Noto Sans SC', sans-serif;
            font-size: 1.4rem;
            font-weight: 500;
            background: linear-gradient(135deg, #d4b56a 0%, #ffffff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            letter-spacing: 1px;
            margin-bottom: 0.4rem;
        }
        .footer-mark .sep {
            color: var(--text-dim);
            font-weight: 300;
            margin: 0 0.5rem;
            -webkit-text-fill-color: var(--text-dim);
        }
        .footer-tagline {
            color: var(--text-soft);
            font-size: 0.78rem;
            letter-spacing: 0.5px;
            margin-bottom: 1.25rem;
        }
        .footer-divider {
            width: 32px;
            height: 1px;
            background: linear-gradient(90deg, var(--gold), var(--white));
            margin: 0 auto 1.25rem;
        }
        .footer-disclaimer {
            color: var(--text-dim);
            font-size: 0.72rem;
            line-height: 1.7;
            margin-bottom: 0.75rem;
        }
        .footer-copyright {
            color: var(--text-dim);
            font-size: 0.7rem;
            letter-spacing: 1px;
        }
        .footer-copyright .copyright-symbol {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.85rem;
            color: var(--text-soft);
            margin-right: 0.2rem;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .top-nav { top: 1rem; right: 1rem; }
            .top-nav-toggle { display: flex; }
            .top-nav-menu {
                display: none;
                position: absolute;
                top: calc(100% + 0.75rem);
                right: 0;
                flex-direction: column;
                align-items: stretch;
                gap: 0;
                padding: 0.5rem 0;
                border-radius: 0.5rem;
                background: rgba(8, 8, 10, 0.95);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border: 1px solid rgba(201, 169, 97, 0.2);
                min-width: 140px;
            }
            .top-nav.open .top-nav-menu { display: flex; }
            .top-nav-menu li + li::before {
                width: calc(100% - 2rem);
                height: 1px;
                margin: 0 1rem;
            }
            .top-nav-menu a {
                display: block;
                padding: 0.7rem 1.25rem;
                text-align: center;

            .top-nav-menu a.active::after {

            .brand { top: 1rem; left: 1rem; }

            .page-header { padding: 2.5rem 1.25rem 2rem; }
            .wechat-section { padding: 0 1.25rem; margin: 1.5rem auto; }

                grid-template-columns: 1fr;

            .article-section { padding: 0 1.25rem; }

            .category-tree { width: 100%; min-width: 0; position: static; max-height: 260px; overflow-y: auto; }
            .category-tree::-webkit-scrollbar { width: 3px; }

    </style>
</head>
<body>
    <!-- 左上角品牌区 -->
    <div class="brand">
        <span class="brand-title">投么有度</span>
        <span class="brand-subtitle">Retirement Plan</span>
    </div>

    <!-- 右上角页面切换 -->
    <div class="top-nav" id="topNav">
        <ul class="top-nav-menu">
            <li><a href="index.html">首页</a></li>
            <li><a href="holdings.html">退休计划</a></li>
            <li><a href="fund-tracking.html">基金跟踪</a></li>
            <li><a href="wechat.html" class="active">文章</a></li>

        <button class="top-nav-toggle" aria-label="切换导航菜单" onclick="this.closest('.top-nav').classList.toggle('open')">
            <span></span><span></span><span></span>
        </button>
    </div>

    <!-- 主内容 -->
    <main class="main-content">
        <div class="grid-bg"></div>

        <!-- 页面头部 -->
        <header class="page-header">
            <div class="header-top">
                <div class="header-left">
                    <h1 class="page-title">叨居</h1>
                    <div class="page-update-time">原创文章 · <span id="articleCount">0</span> 篇</div>
                    <p class="page-subtitle">记录普通投资者的退休计划思考，分享全球资产配置、长期定投与生活哲学。</p>
                </div>
            </div>

        <!-- 文章分类展示 -->
        <section class="article-section">
            <div class="article-layout">
                <!-- 左侧分类树 -->
                <aside class="category-tree">
                    <div class="tree-title">Categories</div>
                    <div id="categoryTree"></div>
                </aside>

                <!-- 右侧文章内容 -->

                    <div id="tabPanels"></div>

            <p class="footer-disclaimer">本站所有内容仅为个人投资记录与思考，不构成任何投资建议</p>
            <p class="footer-copyright"><span class="copyright-symbol"></span> Life &gt; Investment</p>
            <div class="footer-qr">
                <div class="footer-qr-img"><img src="images/qrcode.jpg" alt="公众号二维码"></div>
                <span>扫码关注</span>
                <div class="qr-popup">
                    <div class="qr-popup-img"><img src="images/qrcode.jpg" alt="公众号二维码"></div>
                    <div class="qr-popup-title">叨居</div>
                    <div class="qr-popup-desc">扫码关注公众号</div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/splash-cursor.js?v=2"></script>
    <script>
        (function() {
            // 从 localStorage 读取数据
            var articles = Storage.getArticles();
            var categories = Storage.getCategories();

            // 更新文章总数
            var countEl = document.getElementById('articleCount');
            if (countEl) countEl.textContent = articles.length;

            // 构建左侧分类树（分类为父节点，文章为叶子节点）
            var treeHtml = '';
            categories.forEach(function(cat, i) {
                var iconSvg = (CATEGORY_ICONS[cat.icon] || CATEGORY_ICONS.compass).replace('<svg ', '<svg class="tree-icon" ');
                var list = articles.filter(function(a) { return a.category === cat.name; });
                var escapedName = cat.name.replace(/'/g, "\\'");
                treeHtml += '<div class="tree-node" data-cat="' + cat.name + '">' +
                    '<div class="tree-node-header' + (i === 0 ? ' active' : '') + '" onclick="selectTreeNode(\'' + escapedName + '\')">' +
                    iconSvg +
                    '<span class="tree-label">' + cat.name + '</span>' +
                    '<span class="tree-count">' + list.length + '</span>' +
                    '</div>' +
                    '</div>';
            });
            document.getElementById('categoryTree').innerHTML = treeHtml;

            // 动态生成标签内容面板
            var panelsHtml = '';
            categories.forEach(function(cat, i) {
                panelsHtml += '<div class="tab-panel' + (i === 0 ? ' active' : '') + '" data-panel="' + cat.name + '">' +
                    '<div class="category-header">' +
                    '<h3>' + cat.name + ' <span class="cat-count"></span></h3>' +
                    '<div class="category-desc">' + (cat.desc || '') + '</div>' +
                    '</div>' +
                    '<div class="article-list" data-category="' + cat.name + '"></div>' +
                    '</div>';
            });
            document.getElementById('tabPanels').innerHTML = panelsHtml;

            // 填充文章列表
            categories.forEach(function(cat) {
                var list = articles.filter(function(a) { return a.category === cat.name; });
                var el = document.querySelector('.article-list[data-category="' + cat.name + '"]');
                if (!el) return;
                el.innerHTML = list.map(function(a) {
                    var link = a.link || '';
                    var onclickStr = link
                        ? 'window.open(\'' + link.replace(/'/g, "\\'") + '\', \'_blank\')'
                        : 'showToast(\'该文章暂无链接\', \'info\')';
                    return '<div class="article-item" onclick="' + onclickStr + '">' +
                        '<div class="meta">' +
                        '<span class="badge badge-accent">原创</span>' +
                        '<span>' + a.date + '</span>' +
                        '</div>' +
                        '<div class="title">' + a.title + '</div>' +
                        '<div class="summary">' + a.summary + '</div>' +
                        '</div>';
                }).join('');
                var catCountEl = document.querySelector('.tab-panel[data-panel="' + cat.name + '"] .cat-count');
                if (catCountEl) catCountEl.textContent = '(' + list.length + ')';
            });
        })();

        // 分类树节点选择：点击切换分类
        function selectTreeNode(cat) {
            var node = document.querySelector('.tree-node[data-cat="' + cat + '"]');
            if (!node) return;
            var header = node.querySelector('.tree-node-header');
            document.querySelectorAll('.tree-node-header').forEach(function(h) {
                h.classList.remove('active');
            });
            header.classList.add('active');
            document.querySelectorAll('.tab-panel').forEach(function(p) {
                p.classList.toggle('active', p.dataset.panel === cat);
            });
        }
    </script>
</body>
